server:
  port: 8088

spring:
  application:
    name: peizhenbao-backend
  
  # DataSource Configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:33061/hospital_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: hospital_db
    password: "9r|IOyv2wU"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: PeizhenbaoHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Auto Initialization
  sql:
    init:
      mode: always

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: pzb_redis_123
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.peizhenbao.modules.*.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Custom Application Properties
peizhenbao:
  jwt:
    secret: 926D96C90030DD58429D2751AC1BDBBC
    expiration: 86400000 # 24 hours in milliseconds
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: peizhenbao

# Logging
logging:
  level:
    com.peizhenbao: debug
